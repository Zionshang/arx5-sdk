version: '3.8'

services:
  arx5-x86:
    build:
      context: ..
      dockerfile: docker/Dockerfile.x86
    image: arx5-sdk:x86
    container_name: arx5-sdk-x86
    platform: linux/amd64
    # Essential for hardware access (CAN, USB)
    network_mode: host
    privileged: true
    volumes:
      # Map the source code to allow editing on host (optional)
      # - .:/app
      # Map /dev for hardware access
      - /dev:/dev
      # Map udev rules (optional, helpful if you need to reload rules inside)
      - /run/udev:/run/udev:ro
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    # Interactive mode
    stdin_open: true
    tty: true

  arx5-arm:
    build:
      context: ..
      dockerfile: docker/Dockerfile.arm
    image: arx5-sdk:arm
    container_name: arx5-sdk-arm
    platform: linux/arm64
    # Essential for hardware access (CAN, USB)
    network_mode: host
    privileged: true
    volumes:
      # Map the source code to allow editing on host (optional)
      # - .:/app
      # Map /dev for hardware access
      - /dev:/dev
      # Map udev rules (optional, helpful if you need to reload rules inside)
      - /run/udev:/run/udev:ro
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    # Interactive mode
    stdin_open: true
    tty: true

  # docker-compose run --rm arx5-x86-joystick
  # docker-compose run --rm -e EXAMPLE_SCRIPT=joystick_teleop.py -e EXAMPLE_ARGS="X5_umi can0" arx5-x86-joystick
  arx5-x86-joystick:
    image: arx5-sdk-x86:latest
    container_name: arx5-sdk-x86-joystick
    platform: linux/amd64
    network_mode: host
    privileged: true
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
    environment:
      EXAMPLE_SCRIPT: joystick_teleop.py
      EXAMPLE_ARGS: X5_umi can0
    stdin_open: true
    tty: true
    command: /bin/bash -lc "python /app/python/examples/$${EXAMPLE_SCRIPT} $${EXAMPLE_ARGS}"